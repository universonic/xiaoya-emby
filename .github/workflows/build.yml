name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [ "main" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: docker.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: universonic/xiaoya-emby


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@79abd3f86f79a9d68a23c75a09a9a85889262adf

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: minimal_build
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build amd64 smoke image
        uses: docker/build-push-action@84ad562665bb303b549fec655d1b64f9945f3f91
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: xiaoya-emby:smoke-amd64
          cache-from: type=gha

      - name: Smoke test amd64 image
        run: |
          docker run --rm --platform linux/amd64 xiaoya-emby:smoke-amd64 --version
          test "$(docker run --rm --platform linux/amd64 --entrypoint uname xiaoya-emby:smoke-amd64 -m)" = "x86_64"
          cid=$(docker create --platform linux/amd64 xiaoya-emby:smoke-amd64)
          docker cp "$cid:/app/bin/xiaoya-emby" /tmp/xiaoya-emby-amd64
          docker rm "$cid"
          file /tmp/xiaoya-emby-amd64 | grep -q "x86-64"

      - name: Build arm64 smoke image
        uses: docker/build-push-action@84ad562665bb303b549fec655d1b64f9945f3f91
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: xiaoya-emby:smoke-arm64
          cache-from: type=gha

      - name: Smoke test arm64 image
        run: |
          docker run --rm --platform linux/arm64 xiaoya-emby:smoke-arm64 --version
          test "$(docker run --rm --platform linux/arm64 --entrypoint uname xiaoya-emby:smoke-arm64 -m)" = "aarch64"
          cid=$(docker create --platform linux/arm64 xiaoya-emby:smoke-arm64)
          docker cp "$cid:/app/bin/xiaoya-emby" /tmp/xiaoya-emby-arm64
          docker rm "$cid"
          file /tmp/xiaoya-emby-arm64 | grep -q "ARM aarch64"

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@84ad562665bb303b549fec655d1b64f9945f3f91
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.minimal_build.outputs.tags }}
          labels: ${{ steps.minimal_build.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
